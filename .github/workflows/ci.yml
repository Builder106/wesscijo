name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-lint:
    name: PHP Syntax Check (8.5)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Lint PHP Files
        run: rg --files --null -g '*.php' themes plugins scripts tests | xargs -0 -r -n1 php -l

      - name: Test dashboard query
        run: php tests/dashboard-query.php

      - name: Test email service
        run: php tests/email-service.php

      - name: Test email notifications
        run: php tests/email-notifications.php

      - name: Test event sync
        run: php tests/event-sync.php

  css-lint:
    name: CSS Validation & Stylelint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Lint CSS
        run: npx --yes stylelint "themes/**/*.css" "plugins/wessci-site/admin/css/**/*.css" --formatter compact --max-warnings 0

  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Audit locked Node dependencies
        run: npm audit --audit-level=high

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
