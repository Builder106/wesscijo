<svg xmlns="http://www.w3.org/2000/svg" id="perspectives-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="News, Features and Perspectives optical refraction prism emblem">
  <defs>
    <!-- Crystalline Glass Surface Gradient -->
    <linearGradient id="prism-glass-grad" x1="7.5" y1="31.5" x2="20" y2="7.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Internal Dispersion Wedge Gradient -->
    <linearGradient id="prism-internal-grad" x1="14" y1="19" x2="26.5" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a6192e" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Incident Beam Luminous Gradient -->
    <linearGradient id="beam-in-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.2;0.8;0.2" dur="1.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.95">
        <animate attributeName="stop-opacity" values="0.95;0.4;0.95" dur="1.2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Ruby Ray Luminous Gradient -->
    <linearGradient id="ruby-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6192e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#e11d48;#a6192e;#e11d48" dur="1.2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Amber Ray Luminous Gradient -->
    <linearGradient id="amber-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#fbbf24;#d97706;#fbbf24" dur="1.2s" begin="0.12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Sapphire Ray Luminous Gradient -->
    <linearGradient id="sapphire-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#38bdf8;#2563eb;#38bdf8" dur="1.2s" begin="0.24s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { animation: none !important; display: none !important; }
    }
  </style>

  <!-- Prism Glass Body & Facets -->
  <polygon id="prism-body" points="20,7.5 32.5,31.5 7.5,31.5" fill="url(#prism-glass-grad)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  
  <!-- Subtle Internal 3D Crystalline Facet Edge -->
  <line id="prism-facet" x1="20" y1="7.5" x2="16.5" y2="31.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.22" stroke-linecap="round"/>

  <!-- Specular Apex Edge Sheen -->
  <line id="prism-sheen" x1="18.5" y1="10.4" x2="20" y2="7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Internal Dispersion Wedge (Refracting Light inside Glass) -->
  <polygon id="dispersion-wedge" points="14,19 25.8,18.6 26.8,20.8" fill="url(#prism-internal-grad)" opacity="0.35">
    <animate attributeName="opacity" values="0.25;0.65;0.25" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </polygon>

  <!-- Internal Refracted Light Trajectories -->
  <line x1="14" y1="19" x2="25.8" y2="18.6" stroke="#a6192e" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="19" x2="26.3" y2="19.7" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="19" x2="26.8" y2="20.8" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

  <!-- Incoming Incident Light Beam (Base Ray) -->
  <line id="beam-in" x1="3" y1="23.5" x2="14" y2="19" stroke="url(#beam-in-flow)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Incoming Traveling Photon Stream -->
  <line id="beam-in-pulse" x1="3" y1="23.5" x2="14" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 16">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Outgoing Dispersed Spectral Rays (Base Rays + Traveling Photon Streams) -->
  <!-- Ray 1: Wesleyan Ruby (Bends least) -->
  <line id="beam-out-1" x1="25.8" y1="18.6" x2="38" y2="19.8" stroke="url(#ruby-flow)" stroke-width="2.2" stroke-linecap="round"/>
  <line id="beam-out-1-pulse" x1="25.8" y1="18.6" x2="38" y2="19.8" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 15">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Ray 2: Warm Amber / Gold (Medium dispersion) -->
  <line id="beam-out-2" x1="26.3" y1="19.7" x2="38" y2="24.5" stroke="url(#amber-flow)" stroke-width="2.2" stroke-linecap="round"/>
  <line id="beam-out-2-pulse" x1="26.3" y1="19.7" x2="38" y2="24.5" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 15">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" begin="0.12s" repeatCount="indefinite"/>
  </line>

  <!-- Ray 3: Sapphire Blue (Bends most) -->
  <line id="beam-out-3" x1="26.8" y1="20.8" x2="38" y2="29.5" stroke="url(#sapphire-flow)" stroke-width="2.2" stroke-linecap="round"/>
  <line id="beam-out-3-pulse" x1="26.8" y1="20.8" x2="38" y2="29.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 15">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" begin="0.24s" repeatCount="indefinite"/>
  </line>
</svg>
