<svg id="cardinal-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 470" width="370" height="470" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-label="Cardinal perched on science tree">
  <style>
    :root {
      color-scheme: light dark;
    }
    /* Cardinal SVGator Articulated Avian Kinematics */
    #cardinal-tail,
    #cardinal-feet,
    #cardinal-body,
    #cardinal-head,
    #cardinal-crest,
    #cardinal-beak,
    #beak-lower,
    #cardinal-eye,
    #cardinal-folded-wing {
      transform-box: view-box;
      transform-origin: initial;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #cardinal-body {
      transform-origin: 150px 195px;
      animation: cardinalBreathe 2.4s ease-in-out infinite;
    }

    #cardinal-tail {
      transform-origin: 183px 238px;
      animation: cardinalTailBob 3.0s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    #cardinal-head {
      transform-origin: 93px 107px;
      animation: cardinalHeadSnap 6.0s cubic-bezier(0.2, 0.9, 0.3, 1) infinite;
    }

    #cardinal-crest {
      transform-origin: 100px 43px;
      animation: cardinalCrestSnap 6.0s cubic-bezier(0.2, 0.9, 0.3, 1) infinite;
    }

    #beak-lower {
      transform-origin: 50px 92px;
      animation: cardinalBeakChirp 6.0s ease-in-out infinite;
    }

    #cardinal-eye {
      transform-origin: 75px 74px;
      animation: cardinalDoubleBlink 3.2s infinite;
    }

    #cardinal-feet {
      transform: none !important;
      transform-origin: 166px 290px;
    }

    /* Standalone hover */
    #cardinal-svg:hover #cardinal-head {
      animation: none !important;
      transform: rotate(5deg);
    }

    #cardinal-svg:hover #cardinal-crest {
      animation: none !important;
      transform: rotate(-10deg) scaleY(1.08);
    }

    #cardinal-svg:hover #cardinal-tail {
      animation: none !important;
      transform: rotate(-4deg);
    }

    #cardinal-svg:hover #cardinal-body {
      animation: none !important;
      transform: scale(1.015);
    }

    #cardinal-svg:hover #cardinal-feet {
      transform: none !important;
    }

    @keyframes cardinalBreathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.025);
      }
    }

    @keyframes cardinalTailBob {
      0%, 100% {
        transform: rotate(0deg);
      }
      14% {
        transform: rotate(-7deg);
      }
      22% {
        transform: rotate(4.5deg);
      }
      30% {
        transform: rotate(0.5deg);
      }
      45%, 55% {
        transform: rotate(0deg);
      }
      62% {
        transform: rotate(-5.5deg);
      }
      70% {
        transform: rotate(3.5deg);
      }
      80% {
        transform: rotate(-1deg);
      }
    }

    @keyframes cardinalHeadSnap {
      0%, 20% {
        transform: rotate(0deg);
      }
      23%, 45% {
        transform: rotate(-4deg);
      }
      48%, 70% {
        transform: rotate(5deg);
      }
      73%, 88% {
        transform: rotate(2deg);
      }
      92%, 100% {
        transform: rotate(0deg);
      }
    }

    @keyframes cardinalCrestSnap {
      0%, 20% {
        transform: rotate(0deg);
      }
      23%, 45% {
        transform: rotate(2deg);
      }
      48%, 70% {
        transform: rotate(-8deg) scaleY(1.06);
      }
      73%, 88% {
        transform: rotate(-3deg);
      }
      92%, 100% {
        transform: rotate(0deg);
      }
    }

    @keyframes cardinalBeakChirp {
      0%, 46% {
        transform: rotate(0deg);
      }
      48%, 51% {
        transform: rotate(3.5deg);
      }
      53%, 100% {
        transform: rotate(0deg);
      }
    }

    @keyframes cardinalDoubleBlink {
      0%, 88% {
        transform: scaleY(1);
      }
      90% {
        transform: scaleY(0.05);
      }
      92% {
        transform: scaleY(1);
      }
      94% {
        transform: scaleY(0.05);
      }
      96%, 100% {
        transform: scaleY(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #cardinal-tail,
      #cardinal-head,
      #cardinal-crest,
      #cardinal-eye,
      #cardinal-body,
      #beak-lower {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
    }
  </style>
