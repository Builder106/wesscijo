<svg xmlns="http://www.w3.org/2000/svg" id="quantitative-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="Quantitative and Computational Science neural network graph emblem">
  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { animation: none !important; display: none !important; }
    }
  </style>

  <!-- SYNAPTIC EDGES (Base Graph Topology) -->
  <!-- Layer 1 -> Layer 2 Synapses -->
  <line x1="7.5" y1="10" x2="20" y2="11" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="7.5" y1="10" x2="20" y2="20" stroke="#a6192e" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="7.5" y1="20" x2="20" y2="11" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="7.5" y1="20" x2="20" y2="20" stroke="#a6192e" stroke-width="1.6" stroke-opacity="0.6"/>
  <line x1="7.5" y1="20" x2="20" y2="29" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.25"/>
  <line x1="7.5" y1="30" x2="20" y2="20" stroke="#a6192e" stroke-width="1.4" stroke-opacity="0.5"/>
  <line x1="7.5" y1="30" x2="20" y2="29" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Layer 2 -> Layer 3 (Output) Synapses -->
  <line x1="20" y1="11" x2="32.5" y2="20" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.35"/>
  <line x1="20" y1="20" x2="32.5" y2="20" stroke="#a6192e" stroke-width="1.8" stroke-opacity="0.7"/>
  <line x1="20" y1="29" x2="32.5" y2="20" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- DYNAMIC TRAVELING SYNAPTIC PULSES -->
  <!-- Input Convergence Pulses into Hidden Hub -->
  <line x1="7.5" y1="10" x2="20" y2="20" stroke="#a6192e" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 16">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="2.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>
  <line x1="7.5" y1="20" x2="20" y2="20" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 14">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="2.0s" begin="0.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>
  <line x1="7.5" y1="30" x2="20" y2="20" stroke="#a6192e" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 16">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="2.0s" begin="0.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Hidden Convergence Pulses into Output Synthesis Node -->
  <line x1="20" y1="20" x2="32.5" y2="20" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 14">
    <animate attributeName="stroke-dashoffset" values="18;0" dur="2.0s" begin="0.65s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </line>
  <line x1="20" y1="11" x2="32.5" y2="20" stroke="#d97706" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 16">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="2.0s" begin="0.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </line>
  <line x1="20" y1="29" x2="32.5" y2="20" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 16">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="2.0s" begin="0.75s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- NODES: Precision Vector Neurons -->
  <!-- Layer 1: Inputs -->
  <circle id="node-in-1" cx="7.5" cy="10" r="2.0" fill="currentColor"/>
  <circle id="node-in-2" cx="7.5" cy="20" r="2.2" fill="currentColor"/>
  <circle id="node-in-3" cx="7.5" cy="30" r="2.0" fill="currentColor"/>

  <!-- Layer 2: Hidden Units -->
  <circle id="node-hid-1" cx="20" cy="11" r="2.0" fill="currentColor">
    <animate attributeName="fill" values="currentColor;#d97706;currentColor" dur="2.0s" begin="0.45s" repeatCount="indefinite"/>
  </circle>
  <circle id="node-hid-hub" cx="20" cy="20" r="2.6" fill="#a6192e">
    <animate attributeName="r" values="2.4;3.2;2.4" dur="2.0s" begin="0.55s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>
  <circle id="node-hid-2" cx="20" cy="29" r="2.0" fill="currentColor">
    <animate attributeName="fill" values="currentColor;#2563eb;currentColor" dur="2.0s" begin="0.45s" repeatCount="indefinite"/>
  </circle>

  <!-- Layer 3: Output Activation -->
  <!-- Radiant Activation Wave -->
  <circle cx="32.5" cy="20" r="2.8" stroke="#a6192e" stroke-width="1.2" fill="none" opacity="0">
    <animate attributeName="r" values="2.8;6.0;2.8" dur="2.0s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1; 0.2 0.8 0.2 1"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.0s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle id="node-out" cx="32.5" cy="20" r="2.8" fill="#a6192e">
    <animate attributeName="r" values="2.5;3.3;2.5" dur="2.0s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1; 0.2 0.8 0.2 1"/>
  </circle>
</svg>
