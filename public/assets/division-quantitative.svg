<svg xmlns="http://www.w3.org/2000/svg" id="quantitative-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" role="img" aria-label="Quantitative and Computational Science neural network graph emblem">
  <!-- Network Edges -->
  <line x1="7" y1="14" x2="21" y2="10" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="7" y1="14" x2="21" y2="20" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="7" y1="26" x2="21" y2="20" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="7" y1="26" x2="21" y2="30" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="21" y1="10" x2="33" y2="20" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="21" y1="20" x2="33" y2="20" stroke-width="1.4" stroke-opacity="0.4"/>
  <line x1="21" y1="30" x2="33" y2="20" stroke-width="1.4" stroke-opacity="0.4"/>

  <!-- Traveling Synaptic Data Packets -->
  <circle r="2.2" fill="#a6192e">
    <animateMotion path="M 7,14 L 21,10 L 33,20" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
  </circle>
  <circle r="2" fill="currentColor">
    <animateMotion path="M 7,26 L 21,20 L 33,20" dur="2.2s" begin="0.35s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
  </circle>
  <circle r="2.2" fill="#a6192e">
    <animateMotion path="M 7,26 L 21,30 L 33,20" dur="2.2s" begin="0.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0;0.5;1"/>
  </circle>

  <!-- Network Nodes -->
  <circle id="node-in-1" cx="7" cy="14" r="3" fill="currentColor"/>
  <circle id="node-in-2" cx="7" cy="26" r="3" fill="currentColor"/>
  
  <circle id="node-hid-1" cx="21" cy="10" r="3" fill="currentColor">
    <animate attributeName="fill" values="currentColor;#a6192e;currentColor" dur="2.2s" begin="0.55s" repeatCount="indefinite"/>
  </circle>
  <circle id="node-hid-hub" cx="21" cy="20" r="3.2" fill="#a6192e">
    <animate attributeName="r" values="3;4.2;3" dur="2.2s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>
  <circle id="node-hid-2" cx="21" cy="30" r="3" fill="currentColor">
    <animate attributeName="fill" values="currentColor;#a6192e;currentColor" dur="2.2s" begin="1.25s" repeatCount="indefinite"/>
  </circle>

  <!-- Output Node & Radiant Activation Wave -->
  <circle cx="33" cy="20" r="4.5" stroke="#a6192e" stroke-width="1.2" fill="none">
    <animate attributeName="r" values="4;8;4" dur="2.2s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1; 0.2 0.8 0.2 1"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle id="node-out" cx="33" cy="20" r="3.8" fill="#a6192e">
    <animate attributeName="r" values="3.5;4.6;3.5" dur="2.2s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1; 0.2 0.8 0.2 1"/>
  </circle>
</svg>
