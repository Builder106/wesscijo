<svg xmlns="http://www.w3.org/2000/svg" id="life-science-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Life Science DNA emblem">
  <!-- Backbone strands -->
  <path id="strand-a" d="M11 5 C23 13, 23 27, 11 35" stroke-linecap="round" stroke-width="2.4"/>
  <path id="strand-b" d="M29 5 C17 13, 17 27, 29 35" stroke-linecap="round" stroke-width="2.4"/>
  
  <!-- Base pair rungs with 3D horizontal perspective oscillation & sequential transmission pulse -->
  <line id="rung-1" x1="14" y1="10" x2="26" y2="10" stroke-linecap="round" stroke-width="2.2">
    <animate attributeName="x1" values="14;18;14;11;14" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="x2" values="26;22;26;29;26" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="stroke" values="currentColor;#a6192e;#a6192e;currentColor;currentColor" dur="2.4s" repeatCount="indefinite"/>
  </line>
  
  <line id="rung-2" x1="18" y1="16" x2="22" y2="16" stroke-linecap="round" stroke-width="2.2">
    <animate attributeName="x1" values="18;19;18;15;18" dur="2.4s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="x2" values="22;21;22;25;22" dur="2.4s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="stroke" values="currentColor;#a6192e;#a6192e;currentColor;currentColor" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
  </line>

  <!-- Central helical crossover node -->
  <circle id="core-node" cx="20" cy="20" r="2.2" fill="#a6192e">
    <animate attributeName="r" values="2;3.2;2" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <line id="rung-3" x1="18" y1="24" x2="22" y2="24" stroke-linecap="round" stroke-width="2.2">
    <animate attributeName="x1" values="18;15;18;19;18" dur="2.4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="x2" values="22;25;22;21;22" dur="2.4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="stroke" values="currentColor;#a6192e;#a6192e;currentColor;currentColor" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </line>

  <line id="rung-4" x1="14" y1="30" x2="26" y2="30" stroke-linecap="round" stroke-width="2.2">
    <animate attributeName="x1" values="14;11;14;18;14" dur="2.4s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="x2" values="26;29;26;22;26" dur="2.4s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="stroke" values="currentColor;#a6192e;#a6192e;currentColor;currentColor" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- Terminal nucleic caps -->
  <circle cx="11" cy="5" r="2.8" fill="#a6192e"/>
  <circle cx="29" cy="5" r="2.8" fill="currentColor"/>
  <circle cx="11" cy="35" r="2.8" fill="currentColor"/>
  <circle cx="29" cy="35" r="2.8" fill="#a6192e"/>
</svg>
