<svg xmlns="http://www.w3.org/2000/svg" id="physical-science-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="Physical Science atomic orbital emblem">
  <!-- Nucleus Solid Core -->
  <circle id="nucleus" cx="20" cy="20" r="2.8" fill="#a6192e"/>

  <!-- Orbital Tracks (3-Fold Symmetrical Triad at 60 deg intervals) -->
  <ellipse cx="20" cy="20" rx="15" ry="5.5" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85" transform="rotate(-30 20 20)"/>
  <ellipse cx="20" cy="20" rx="15" ry="5.5" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85" transform="rotate(30 20 20)"/>
  <ellipse cx="20" cy="20" rx="15" ry="5.5" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85" transform="rotate(90 20 20)"/>

  <!-- Valence Electrons -->
  <circle cx="20.0" cy="5.0" r="2.2" fill="#a6192e"/>
  <circle cx="6.74" cy="26.01" r="2.2" fill="#a6192e"/>
  <circle cx="31.27" cy="28.68" r="2.2" fill="currentColor"/>
</svg>
