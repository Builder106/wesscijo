<svg xmlns="http://www.w3.org/2000/svg" id="search-lens-svg" viewBox="0 0 80 80" width="80" height="80" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Scientific search lens and reticle calibration emblem">
  <!-- Outer Optics Rim & Lens Handle -->
  <circle id="outer-rim" cx="36" cy="36" r="26" stroke-width="2.6"/>
  <line id="lens-handle" x1="55" y1="55" x2="73" y2="73" stroke-width="4.8" stroke-linecap="round"/>

  <!-- Rotating Microscope Vernier Dial Scale -->
  <g transform-origin="36 36">
    <circle cx="36" cy="36" r="21" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 6" stroke-opacity="0.6"/>
    <animateTransform attributeName="transform" type="rotate" values="0 36 36; 60 36 36; 0 36 36; -60 36 36; 0 36 36" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </g>

  <!-- Precision Calibrated Crosshairs -->
  <line id="reticle-h" x1="18" y1="36" x2="54" y2="36" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <line id="reticle-v" x1="36" y1="18" x2="36" y2="54" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Vernier Sub-Scale Graticule Ticks -->
  <line x1="28" y1="34" x2="28" y2="38" stroke="currentColor" stroke-width="1.2"/>
  <line x1="44" y1="34" x2="44" y2="38" stroke="currentColor" stroke-width="1.2"/>
  <line x1="34" y1="28" x2="38" y2="28" stroke="currentColor" stroke-width="1.2"/>
  <line x1="34" y1="44" x2="38" y2="44" stroke="currentColor" stroke-width="1.2"/>

  <!-- Calibrating Focal Acquisition Target Ring -->
  <circle id="target-ring" cx="36" cy="36" r="13" stroke="#a6192e" stroke-width="1.6" stroke-dasharray="4 2">
    <animate attributeName="r" values="15;10;15" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Focal Acquisition Point -->
  <circle id="focal-point" cx="36" cy="36" r="2.2" fill="#a6192e">
    <animate attributeName="r" values="1.8;2.8;1.8" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>
</svg>
