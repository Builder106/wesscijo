<svg xmlns="http://www.w3.org/2000/svg" id="life-science-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Life Science DNA double helix emblem">
  <!-- Rung 1 (y=7.5, Upper Lobe) -->
  <line x1="11.5" y1="7.5" x2="18.5" y2="7.5" stroke="#a6192e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21.5" y1="7.5" x2="28.5" y2="7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="7.5" r="1.8" fill="#d97706"/>

  <!-- Rung 2 (y=10.5, Upper Lobe) -->
  <line x1="15.5" y1="10.5" x2="18.5" y2="10.5" stroke="#a6192e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21.5" y1="10.5" x2="24.5" y2="10.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="10.5" r="1.8" fill="#d97706"/>

  <!-- Upper Crossover: Strand B has gap, Strand A is continuous in front -->
  <path d="M 31,5 C 31,8.5 24,10 22.5,11.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 17.5,14.5 C 16,16 9,17.5 9,21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 9,5 C 9,9 20,9 20,13 C 20,17 31,17 31,21" stroke="#a6192e" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Rung 3 (y=16.5, Center Lobe) -->
  <line x1="15" y1="16.5" x2="18.5" y2="16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21.5" y1="16.5" x2="25" y2="16.5" stroke="#a6192e" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="16.5" r="1.8" fill="#d97706"/>

  <!-- Center Swell Base Pair (Maximum Width 22px) -->
  <line x1="9" y1="21" x2="18.5" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="21.5" y1="21" x2="31" y2="21" stroke="#a6192e" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="20" cy="21" r="2.4" fill="#d97706"/>

  <!-- Rung 5 (y=25.5, Center Lobe) -->
  <line x1="15" y1="25.5" x2="18.5" y2="25.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21.5" y1="25.5" x2="25" y2="25.5" stroke="#a6192e" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="25.5" r="1.8" fill="#d97706"/>

  <!-- Lower Crossover: Strand A has gap, Strand B is continuous in front -->
  <path d="M 31,21 C 31,24.5 24,26 22.5,27.5" stroke="#a6192e" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 17.5,30.5 C 16,32 9,33.5 9,37" stroke="#a6192e" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 9,21 C 9,25 20,25 20,29 C 20,33 31,33 31,37" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Rung 6 (y=31.5, Lower Lobe) -->
  <line x1="15.5" y1="31.5" x2="18.5" y2="31.5" stroke="#a6192e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21.5" y1="31.5" x2="24.5" y2="31.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="31.5" r="1.8" fill="#d97706"/>

  <!-- Rung 7 (y=34.5, Lower Lobe) -->
  <line x1="11.5" y1="34.5" x2="18.5" y2="34.5" stroke="#a6192e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21.5" y1="34.5" x2="28.5" y2="34.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="34.5" r="1.8" fill="#d97706"/>

  <!-- Terminal Nucleic Caps -->
  <circle cx="9" cy="5" r="3.4" fill="#a6192e"/>
  <circle cx="31" cy="5" r="3.4" fill="currentColor"/>
  <circle cx="9" cy="37" r="3.4" fill="#a6192e"/>
  <circle cx="31" cy="37" r="3.4" fill="currentColor"/>
</svg>
