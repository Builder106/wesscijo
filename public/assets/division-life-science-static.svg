<svg xmlns="http://www.w3.org/2000/svg" id="life-science-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="Life Science DNA double helix emblem">
  <!-- Horizontal Base Pair Rungs -->
  <g id="base-pairs">
    <!-- Rung 1 at y=6.0 -->
    <line x1="29.5" y1="6.0" x2="20" y2="6.0" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="6.0" x2="10.5" y2="6.0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="6.0" r="1" fill="#d97706"/>
    <!-- Rung 2 at y=9.5 -->
    <line x1="26.7" y1="9.5" x2="20" y2="9.5" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="9.5" x2="13.3" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="9.5" r="1" fill="#d97706"/>
    <!-- Rung 3 at y=13.0 -->
    <line x1="20.0" y1="13.0" x2="20" y2="13.0" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="13.0" x2="20.0" y2="13.0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="13.0" r="1" fill="#d97706"/>
    <!-- Rung 4 at y=16.5 -->
    <line x1="13.3" y1="16.5" x2="20" y2="16.5" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="16.5" x2="26.7" y2="16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="16.5" r="1" fill="#d97706"/>
    <!-- Rung 5 at y=20.0 -->
    <line x1="10.5" y1="20.0" x2="20" y2="20.0" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="20.0" x2="29.5" y2="20.0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="20.0" r="1" fill="#d97706"/>
    <!-- Rung 6 at y=23.5 -->
    <line x1="13.3" y1="23.5" x2="20" y2="23.5" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="23.5" x2="26.7" y2="23.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="23.5" r="1" fill="#d97706"/>
    <!-- Rung 7 at y=27.0 -->
    <line x1="20.0" y1="27.0" x2="20" y2="27.0" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="27.0" x2="20.0" y2="27.0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="27.0" r="1" fill="#d97706"/>
    <!-- Rung 8 at y=30.5 -->
    <line x1="26.7" y1="30.5" x2="20" y2="30.5" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="30.5" x2="13.3" y2="30.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="30.5" r="1" fill="#d97706"/>
    <!-- Rung 9 at y=34.0 -->
    <line x1="29.5" y1="34.0" x2="20" y2="34.0" stroke="#a6192e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="34.0" x2="10.5" y2="34.0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="34.0" r="1" fill="#d97706"/>
  </g>

  <!-- Continuous Helical Backbone Strands -->
  <path id="strand-ruby" d="M 29.5,6.0 L 29.0,7.4 L 27.7,8.8 L 25.6,10.2 L 22.9,11.6 L 20.0,13.0 L 17.1,14.4 L 14.4,15.8 L 12.3,17.2 L 11.0,18.6 L 10.5,20.0 L 11.0,21.4 L 12.3,22.8 L 14.4,24.2 L 17.1,25.6 L 20.0,27.0 L 22.9,28.4 L 25.6,29.8 L 27.7,31.2 L 29.0,32.6 L 29.5,34.0" stroke="#a6192e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path id="strand-ink" d="M 10.5,6.0 L 11.0,7.4 L 12.3,8.8 L 14.4,10.2 L 17.1,11.6 L 20.0,13.0 L 22.9,14.4 L 25.6,15.8 L 27.7,17.2 L 29.0,18.6 L 29.5,20.0 L 29.0,21.4 L 27.7,22.8 L 25.6,24.2 L 22.9,25.6 L 20.0,27.0 L 17.1,28.4 L 14.4,29.8 L 12.3,31.2 L 11.0,32.6 L 10.5,34.0" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Nucleotide Terminal Nodes -->
  <g id="nucleotide-nodes">
    <circle cx="29.5" cy="6.0" r="1.5" fill="#a6192e" opacity="0.40"/>
    <circle cx="10.5" cy="6.0" r="1.5" fill="currentColor" opacity="0.40"/>
    <circle cx="26.7" cy="9.5" r="2.3" fill="#a6192e" opacity="1.00"/>
    <circle cx="13.3" cy="9.5" r="1.5" fill="currentColor" opacity="0.40"/>
    <circle cx="20.0" cy="13.0" r="2.3" fill="#a6192e" opacity="1.00"/>
    <circle cx="20.0" cy="13.0" r="1.5" fill="currentColor" opacity="0.40"/>
    <circle cx="13.3" cy="16.5" r="2.3" fill="#a6192e" opacity="1.00"/>
    <circle cx="26.7" cy="16.5" r="1.5" fill="currentColor" opacity="0.40"/>
    <circle cx="10.5" cy="20.0" r="2.3" fill="#a6192e" opacity="1.00"/>
    <circle cx="29.5" cy="20.0" r="1.5" fill="currentColor" opacity="0.40"/>
    <circle cx="13.3" cy="23.5" r="1.5" fill="#a6192e" opacity="0.40"/>
    <circle cx="26.7" cy="23.5" r="2.3" fill="currentColor" opacity="1.00"/>
    <circle cx="20.0" cy="27.0" r="1.5" fill="#a6192e" opacity="0.40"/>
    <circle cx="20.0" cy="27.0" r="2.3" fill="currentColor" opacity="1.00"/>
    <circle cx="26.7" cy="30.5" r="1.5" fill="#a6192e" opacity="0.40"/>
    <circle cx="13.3" cy="30.5" r="2.3" fill="currentColor" opacity="1.00"/>
    <circle cx="29.5" cy="34.0" r="1.5" fill="#a6192e" opacity="0.40"/>
    <circle cx="10.5" cy="34.0" r="2.3" fill="currentColor" opacity="1.00"/>
  </g>
</svg>