<svg xmlns="http://www.w3.org/2000/svg" id="physical-science-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="Physical Science atomic orbital emblem">
  <style>
    :root {
      --ink: #111827;
      --accent: #a6192e;
      color: var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ede8e5;
        --accent: #e63946;
        color: var(--ink);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateMotion { animation: none !important; }
    }
  </style>

  <!-- Nucleus Solid Core -->
  <circle id="nucleus" cx="20" cy="20" r="2.8" fill="var(--accent, #a6192e)"/>

  <!-- Orbital Track 1 (-30 deg) & Electron Alpha -->
  <g transform="rotate(-30 20 20)">
    <ellipse cx="20" cy="20" rx="15" ry="5.5" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
    <circle fill="var(--accent, #a6192e)">
      <animateMotion path="M 5,20 a 15,5.5 0 1,0 30,0 a 15,5.5 0 1,0 -30,0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.1;1.7;2.1;2.5;2.1" keyTimes="0;0.25;0.5;0.75;1" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.65;0.95;1.0;0.95" keyTimes="0;0.25;0.5;0.75;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Orbital Track 2 (+30 deg) & Electron Beta -->
  <g transform="rotate(30 20 20)">
    <ellipse cx="20" cy="20" rx="15" ry="5.5" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
    <circle fill="currentColor">
      <animateMotion path="M 35,20 a 15,5.5 0 1,0 -30,0 a 15,5.5 0 1,0 30,0" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.1;2.5;2.1;1.7;2.1" keyTimes="0;0.25;0.5;0.75;1" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;1.0;0.95;0.65;0.95" keyTimes="0;0.25;0.5;0.75;1" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Orbital Track 3 (90 deg / Vertical) & Electron Gamma -->
  <g transform="rotate(90 20 20)">
    <ellipse cx="20" cy="20" rx="15" ry="5.5" stroke="currentColor" stroke-width="1.3" stroke-opacity="0.85"/>
    <circle fill="var(--accent, #a6192e)">
      <animateMotion path="M 5,20 a 15,5.5 0 1,0 30,0 a 15,5.5 0 1,0 -30,0" dur="3.1s" begin="-2.0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.1;1.7;2.1;2.5;2.1" keyTimes="0;0.25;0.5;0.75;1" dur="3.1s" begin="-2.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;0.65;0.95;1.0;0.95" keyTimes="0;0.25;0.5;0.75;1" dur="3.1s" begin="-2.0s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
