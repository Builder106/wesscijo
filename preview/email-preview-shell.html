<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WesSciJo email preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #ececee; color: #262123; font-family: Arial, Helvetica, sans-serif; }
    header { padding: 20px 24px; background: #ffffff; border-bottom: 1px solid #d9d5d7; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: normal; }
    p { margin: 0 0 16px; font-size: 14px; line-height: 21px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
    label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    select, button { min-height: 44px; padding: 8px 12px; font: inherit; border: 1px solid #bcb6b9; border-radius: 0; background: #ffffff; color: #262123; }
    :focus-visible { outline: 2px solid #a80f29; outline-offset: 3px; }
    main { padding: 28px 12px; }
    iframe { display: block; width: 740px; max-width: 100%; height: 1000px; margin: auto; border: 0; background: #ffffff; }
    body[data-width="phone"] iframe { width: 390px; }
    body[data-width="small"] iframe { width: 320px; }
    body[data-theme="dark"] { background: #100e0f; }
    #copy-result { font-size: 14px; }
    @media (max-width: 480px) { header { padding: 16px; } main { padding: 16px 0; } }
  </style>
</head>
<body data-width="desktop" data-theme="light">
  <header>
    <h1>WesSciJo email preview</h1>
    <p>Design draft. All names, manuscript details, dates, and destinations below are fictional examples.</p>
    <div class="controls">
      <label>Email <select id="template">
        <option value="editorial-decision">Editorial decision</option>
        <option value="reviewer-invitation">Review invitation</option>
        <option value="submission-confirmation">Submission receipt</option>
        <option value="publication-notice">Publication notice</option>
        <option value="account-access">New account</option>
        <option value="password-reset">Password reset</option>
      </select></label>
      <label>Width <select id="width"><option value="desktop">Desktop</option><option value="phone">390 px</option><option value="small">320 px</option></select></label>
      <label>Theme <select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label><input id="images" type="checkbox" checked> Show images</label>
      <button id="copy" type="button">Copy email HTML</button>
      <span id="copy-result" role="status"></span>
    </div>
  </header>
  <main><iframe id="preview-frame" title="Email preview" sandbox="allow-same-origin"></iframe></main>
  <script>
    const emails = __EMAILS__;
    const previewLogo = __LOGO__;
    const frame = document.getElementById('preview-frame');
    const template = document.getElementById('template');
    const theme = document.getElementById('theme');
    const images = document.getElementById('images');
    function update() {
      document.body.dataset.theme = theme.value;
      let html = emails[template.value].replace(/https:\/\/example\.org\/wp-content\/plugins\/wessci-site\/admin\/images\/wessci-logo\.png/g, previewLogo);
      if (theme.value === 'dark') {
        html = html.replace('</head>', '<style>.wessci-paper{background:#181617!important;color:#e9e6e7!important}.wessci-text-muted{color:#b9b4b7!important}.wessci-link{color:#ff8b9c!important}.wessci-rule{border-color:#514b4e!important}</style></head>');
      }
      if (!images.checked) html = html.replace(/<img\b[^>]*>/g, '');
      frame.srcdoc = html;
      document.getElementById('copy-result').textContent = '';
    }
    template.addEventListener('change', update);
    theme.addEventListener('change', update);
    images.addEventListener('change', update);
    document.getElementById('width').addEventListener('change', event => {
      document.body.dataset.width = event.target.value;
    });
    frame.addEventListener('load', () => {
      frame.style.height = '1px';
      frame.style.height = `${frame.contentDocument.documentElement.scrollHeight + 24}px`;
    });
    document.getElementById('copy').addEventListener('click', async () => {
      const result = document.getElementById('copy-result');
      try {
        await navigator.clipboard.writeText(emails[template.value]);
        result.textContent = 'Copied.';
      } catch {
        result.textContent = 'Clipboard unavailable in this browser.';
      }
    });
    update();
  </script>
</body>
</html>
