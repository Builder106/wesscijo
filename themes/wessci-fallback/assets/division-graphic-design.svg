<svg xmlns="http://www.w3.org/2000/svg" id="graphic-design-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="Graphic Design artist palette and brush emblem">
  <defs>
    <linearGradient id="palette-wood-grad" x1="8" y1="6" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <style>
    :root {
      --ink: #111827;
      --accent: #a6192e;
      --amber: #d97706;
      --cyan: #0284c7;
      --green: #10b981;
      color: var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ede8e5;
        --accent: #e63946;
        --amber: #fbbf24;
        --cyan: #38bdf8;
        --green: #34d399;
        color: var(--ink);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { animation: none !important; }
    }
  </style>

  <!-- Palette Contour Body -->
  <path id="palette-board" d="M 21,5.5 C 29,5.5 35,9.5 35,17 C 35,24 30.5,31 22.5,33 C 16.5,34.5 10,32 7.5,26.5 C 5.5,21 6.5,13.5 11.5,9 C 14.5,6.3 17.5,5.5 21,5.5 Z" fill="url(#palette-wood-grad)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Thumbhole Aperture -->
  <circle id="thumbhole" cx="12.5" cy="24" r="2.4" fill="none" stroke="currentColor" stroke-width="1.3"/>

  <!-- Chromatic Pigment Wells / Color Swatches -->
  <!-- 1. Ruby / Crimson Well (Wesleyan Accent) -->
  <circle cx="13.5" cy="11.5" r="2.2" fill="var(--accent, #a6192e)">
    <animate attributeName="r" values="2.2; 2.7; 2.2" dur="2.4s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>

  <!-- 2. Amber / Gold Well -->
  <circle cx="21" cy="9.5" r="2.2" fill="var(--amber, #d97706)">
    <animate attributeName="r" values="2.2; 2.7; 2.2" dur="2.4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>

  <!-- 3. Cyan / Process Blue Well -->
  <circle cx="28" cy="13.5" r="2.2" fill="var(--cyan, #0284c7)">
    <animate attributeName="r" values="2.2; 2.7; 2.2" dur="2.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>

  <!-- 4. Emerald Green Well -->
  <circle cx="30" cy="21.5" r="2.2" fill="var(--green, #10b981)">
    <animate attributeName="r" values="2.2; 2.7; 2.2" dur="2.4s" begin="1.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>

  <!-- Designer's Fine Detailing Brush Assembly -->
  <g id="designer-brush">
    <animateTransform attributeName="transform" type="translate" values="0,0; -1,1.5; 0,0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>

    <!-- Wooden Handle -->
    <path d="M 6.5,34.5 L 17.5,23.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Metal Ferrule (Collar) -->
    <line x1="17.5" y1="23.5" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Fine Tapered Bristles -->
    <path d="M 20.5,20.5 Q 22.5,19.5 24.5,16.5 Q 22.5,18.5 20.5,20.5 Z" fill="currentColor"/>

    <!-- Paint on the Bristle Tip (Ruby Accent) -->
    <circle cx="24.5" cy="16.5" r="1.3" fill="var(--accent, #a6192e)">
      <animate attributeName="r" values="1.3; 1.8; 1.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
