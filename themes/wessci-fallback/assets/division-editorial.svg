<svg xmlns="http://www.w3.org/2000/svg" id="editorial-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="Editorial Board scholarly fountain pen and manuscript flourish emblem">
  <defs>
    <linearGradient id="nib-body-grad" x1="12" y1="5" x2="28" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <style>
    :root {
      --ink: #111827;
      --accent: #a6192e;
      --amber: #d97706;
      color: var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ede8e5;
        --accent: #e63946;
        --amber: #fbbf24;
        color: var(--ink);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { animation: none !important; }
    }
  </style>

  <!-- Editorial Folio Guidelines (Background Substratum) -->
  <line x1="8" y1="30.5" x2="32" y2="30.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.2" stroke-dasharray="2 3"/>

  <!-- Dynamic Scholarly Fountain Pen Nib Assembly -->
  <g id="fountain-nib">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.2; 0,0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>

    <!-- Nib Collar / Grip -->
    <path d="M 14.5,4.5 L 25.5,4.5 L 24.5,7.5 L 15.5,7.5 Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Nib Main Shroud & Contour -->
    <path d="M 15.5,7.5 C 13,10.5 9.5,12 9.5,14.5 C 9.5,18 15,22.5 20,26.5 C 25,22.5 30.5,18 30.5,14.5 C 30.5,12 27,10.5 24.5,7.5 Z" fill="url(#nib-body-grad)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Classical Nib Filigree & Shoulder Engravings -->
    <path d="M 13.5,10 C 12,12.5 11.5,14 11.5,15.5 C 11.5,18 15.5,21.5 18,23.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35" stroke-linecap="round" fill="none"/>
    <path d="M 26.5,10 C 28,12.5 28.5,14 28.5,15.5 C 28.5,18 24.5,21.5 22,23.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35" stroke-linecap="round" fill="none"/>

    <!-- Central Ink Tine Slit -->
    <line x1="20" y1="16.5" x2="20" y2="26.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Traveling Ink Pulse down the central slit -->
    <line x1="20" y1="16.5" x2="20" y2="26.5" stroke="var(--accent, #a6192e)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 10">
      <animate attributeName="stroke-dashoffset" values="13;0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </line>

    <!-- Breather Aperture (Heart of the Nib) -->
    <circle cx="20" cy="15" r="2.2" fill="var(--accent, #a6192e)">
      <animate attributeName="r" values="2.2; 2.6; 2.2" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0.9; 1.0; 0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="15" r="1.0" fill="var(--amber, #d97706)"/>

    <!-- Iridium Tip Sheen / Micro Glint -->
    <circle cx="20" cy="26.5" r="1.3" fill="var(--accent, #a6192e)">
      <animate attributeName="opacity" values="0.4; 1.0; 0.4" dur="2.4s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </circle>
  </g>

  <!-- Flowing Editorial Calligraphic Inscription Stroke -->
  <path d="M 6.5,33.5 C 11.5,31.5 15.5,34.5 20,32.5 C 24.5,30.5 28.5,34 33.5,32" stroke="var(--accent, #a6192e)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="36" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="36; 0; 0; 36" keyTimes="0; 0.45; 0.8; 1" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.8 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="stroke" values="var(--accent, #a6192e); var(--amber, #d97706); var(--accent, #a6192e); var(--accent, #a6192e)" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- Editorial Verification Dot -->
  <circle cx="34.5" cy="32" r="1.5" fill="var(--accent, #a6192e)">
    <animate attributeName="opacity" values="0.1; 1.0; 1.0; 0.1" keyTimes="0; 0.45; 0.8; 1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>

