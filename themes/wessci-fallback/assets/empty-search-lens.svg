<svg xmlns="http://www.w3.org/2000/svg" id="search-lens-svg" viewBox="0 0 80 80" width="80" height="80" fill="none" role="img" aria-label="Scientific search lens and reticle calibration emblem">
  <defs>
    <!-- Optical Lens Glass Backing -->
    <linearGradient id="lens-glass-grad" x1="16" y1="16" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <style>
    :root {
      --ink: #111827;
      --accent: #a6192e;
      color: var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ede8e5;
        --accent: #e63946;
        color: var(--ink);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { animation: none !important; }
    }
  </style>

  <!-- Lens Glass Backing -->
  <circle cx="36" cy="36" r="26" fill="url(#lens-glass-grad)"/>

  <!-- Outer Optics Rim & Ergonomic Handle -->
  <circle id="outer-rim" cx="36" cy="36" r="26" stroke="currentColor" stroke-width="2.8"/>
  <line id="lens-handle" x1="55" y1="55" x2="73" y2="73" stroke="currentColor" stroke-width="5.0" stroke-linecap="round"/>

  <!-- Rotating Microscope Vernier Dial Scale (Concentric at 36, 36) -->
  <g>
    <circle cx="36" cy="36" r="21" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 5" stroke-opacity="0.75"/>
    <animateTransform attributeName="transform" type="rotate" from="0 36 36" to="360 36 36" dur="4.0s" repeatCount="indefinite"/>
  </g>

  <!-- Expanding Optical Focal Acquisition Waves (Active Radar/Focus Scan) -->
  <circle cx="36" cy="36" r="4" stroke="var(--accent, #a6192e)" stroke-width="1.6" fill="none" opacity="0">
    <animate attributeName="r" values="4;22" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
    <animate attributeName="opacity" values="0.85;0" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
    <animate attributeName="stroke-width" values="1.8;0.8" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="36" r="4" stroke="var(--accent, #a6192e)" stroke-width="1.6" fill="none" opacity="0">
    <animate attributeName="r" values="4;22" dur="2.2s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
    <animate attributeName="opacity" values="0.85;0" dur="2.2s" begin="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.8 0.2 1"/>
    <animate attributeName="stroke-width" values="1.8;0.8" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
  </circle>

  <!-- Precision Calibrated Reticle Crosshairs -->
  <line id="reticle-h" x1="16" y1="36" x2="56" y2="36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line id="reticle-v" x1="36" y1="16" x2="36" y2="56" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Vernier Sub-Scale Graticule Ticks -->
  <line x1="26" y1="33" x2="26" y2="39" stroke="currentColor" stroke-width="1.2"/>
  <line x1="46" y1="33" x2="46" y2="39" stroke="currentColor" stroke-width="1.2"/>
  <line x1="33" y1="26" x2="39" y2="26" stroke="currentColor" stroke-width="1.2"/>
  <line x1="33" y1="46" x2="39" y2="46" stroke="currentColor" stroke-width="1.2"/>

  <!-- Static Calibration Target Ring -->
  <circle id="target-ring-static" cx="36" cy="36" r="11" stroke="var(--accent, #a6192e)" stroke-width="1.4" stroke-dasharray="4 2" stroke-opacity="0.8"/>

  <!-- Central Focal Acquisition Point -->
  <circle id="focal-point" cx="36" cy="36" r="2.4" fill="var(--accent, #a6192e)">
    <animate attributeName="r" values="2.0;3.0;2.0" dur="1.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>
</svg>
