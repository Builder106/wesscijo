<svg xmlns="http://www.w3.org/2000/svg" id="editorial-svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="Editorial Board scholarly fountain pen and manuscript flourish emblem">
  <defs>
    <linearGradient id="nib-body-grad" x1="12" y1="5" x2="28" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <style>
    :root {
      --ink: #111827;
      --accent: #a6192e;
      --amber: #d97706;
      color: var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ede8e5;
        --accent: #e63946;
        --amber: #fbbf24;
        color: var(--ink);
      }
    }
  </style>

  <!-- Editorial Folio Guidelines (Background Substratum) -->
  <line x1="8" y1="30.5" x2="32" y2="30.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.2" stroke-dasharray="2 3"/>

  <!-- Scholarly Fountain Pen Nib Assembly -->
  <g id="fountain-nib">
    <!-- Nib Collar / Grip -->
    <path d="M 14.5,4.5 L 25.5,4.5 L 24.5,7.5 L 15.5,7.5 Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Nib Main Shroud & Contour -->
    <path d="M 15.5,7.5 C 13,10.5 9.5,12 9.5,14.5 C 9.5,18 15,22.5 20,26.5 C 25,22.5 30.5,18 30.5,14.5 C 30.5,12 27,10.5 24.5,7.5 Z" fill="url(#nib-body-grad)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Classical Nib Filigree & Shoulder Engravings -->
    <path d="M 13.5,10 C 12,12.5 11.5,14 11.5,15.5 C 11.5,18 15.5,21.5 18,23.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35" stroke-linecap="round" fill="none"/>
    <path d="M 26.5,10 C 28,12.5 28.5,14 28.5,15.5 C 28.5,18 24.5,21.5 22,23.5" stroke="currentColor" stroke-width="1.0" stroke-opacity="0.35" stroke-linecap="round" fill="none"/>

    <!-- Central Ink Tine Slit -->
    <line x1="20" y1="16.5" x2="20" y2="26.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Breather Aperture (Heart of the Nib) -->
    <circle cx="20" cy="15" r="2.2" fill="var(--accent, #a6192e)"/>
    <circle cx="20" cy="15" r="1.0" fill="var(--amber, #d97706)"/>

    <!-- Iridium Tip Sheen -->
    <circle cx="20" cy="26.5" r="1.3" fill="var(--accent, #a6192e)"/>
  </g>

  <!-- Flowing Editorial Calligraphic Inscription Stroke -->
  <path d="M 6.5,33.5 C 11.5,31.5 15.5,34.5 20,32.5 C 24.5,30.5 28.5,34 33.5,32" stroke="var(--accent, #a6192e)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Editorial Verification Dot -->
  <circle cx="34.5" cy="32" r="1.5" fill="var(--accent, #a6192e)"/>
</svg>

